# NGINX Reverse Proxy Configuration for Host Server
# This file should be placed in /etc/nginx/sites-available/ (or sites-enabled/)
# and symlinked or included in your main nginx.conf

# Redirect HTTP to HTTPS for both domains
server {
    listen 80;
    listen [::]:80;
    server_name qwranks.com www.qwranks.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server block for qwranks.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qwranks.com;

    # SSL certificate configuration (update paths to your certificates)
    # ssl_certificate /etc/letsencrypt/live/qwranks.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/qwranks.com/privkey.pem;
    
    # SSL configuration (uncomment when SSL is set up)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/qwranks.com.access.log;
    error_log /var/log/nginx/qwranks.com.error.log;

    # Proxy settings
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # Headers to pass to the container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed in the future)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoint (optional, for monitoring)
    location /health {
        proxy_pass http://localhost:8080/health;
        access_log off;
    }
}

# HTTPS server block for www.qwranks.com
