server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets with versioning
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for HTML files
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Games route - no cache (as per firebase.json)
    location /games {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /games/index.html;
    }

    # Players route
    location /players {
        try_files $uri $uri/ /players/index.html;
    }

    # QTV route
    location /qtv {
        try_files $uri $uri/ /qtv/index.html;
    }

    # QTV Popout route
    location /qtv-popout {
        try_files $uri $uri/ /qtv-popout/index.html;
    }

    # Scoreboard route
    location /scoreboard {
        try_files $uri $uri/ /scoreboard/index.html;
    }

    # Profile route
    location /profile {
        try_files $uri $uri/ /profile/index.html;
    }

    # Root and all other routes fallback to main index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
